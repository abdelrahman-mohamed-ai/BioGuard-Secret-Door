name: Public snapshot checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run dataset-free publication smoke tests
        run: python -m pytest -q tests/test_public_snapshot.py

      - name: Run first-run security tests
        run: >-
          python -m pytest -q flask_game/tests/test_security.py
          -k "factory_starts_in_first_run_setup_without_secrets or first_run_setup_persists_hashed_admin_secret"
